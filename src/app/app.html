<div class="container-fluid px-4 mt-4">
  <!-- Bootstrap Nav Tabs -->
  <ul class="nav nav-tabs" id="myTab" role="tablist">
    <li class="nav-item" role="presentation">
      <button 
        class="nav-link" 
        [class.active]="activeTab() === 'comp1'" 
        (click)="selectTab('comp1')"
        id="comp1-tab" 
        type="button" 
        role="tab" 
        aria-controls="comp1" 
        [attr.aria-selected]="activeTab() === 'comp1'">
        Comp1 (Claude AI)
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button 
        class="nav-link" 
        [class.active]="activeTab() === 'comp2'" 
        (click)="selectTab('comp2')"
        id="comp2-tab" 
        type="button" 
        role="tab" 
        aria-controls="comp2" 
        [attr.aria-selected]="activeTab() === 'comp2'">
        Comp2
      </button>
    </li>
  </ul>

  <!-- Tab Content Panel -->
  <div class="tab-content border border-top-0 rounded-bottom bg-white overflow-hidden" id="myTabContent" style="min-height: 500px;">
    @if (activeTab() === 'comp1') {
      <div class="tab-pane fade show active h-100" id="comp1" role="tabpanel" aria-labelledby="comp1-tab">
        <app-comp1></app-comp1>
      </div>
    }
    @if (activeTab() === 'comp2') {
      <div class="tab-pane fade show active p-4 text-center" id="comp2" role="tabpanel" aria-labelledby="comp2-tab">
        <app-comp2></app-comp2>
      </div>
    }
  </div>
</div>
